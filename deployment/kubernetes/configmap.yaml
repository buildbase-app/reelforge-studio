# Non-secret settings shared by every instance (docs/CONFIG.md). Secrets come
# from the "reelforge" Secret as files (*_FILE), never from here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reelforge
  namespace: reelforge
data:
  REELFORGE_PUBLIC_URL: "https://studio.example.com"
  REELFORGE_ALLOWED_HOSTS: "reelforge-api,reelforge-api.reelforge.svc"
  REELFORGE_TRUST_PROXY: "true"            # behind an ingress that sets X-Forwarded-For
  # Shared storage: required for more than one instance (D-076).
  REELFORGE_STORAGE_DRIVER: "s3"
  REELFORGE_S3_BUCKET: "reelforge-renders"
  REELFORGE_S3_REGION: "eu-central-1"
  # REELFORGE_S3_ENDPOINT: "http://minio.minio.svc:9000"   # MinIO / S3-compatible services
  # REELFORGE_S3_FORCE_PATH_STYLE: "true"
  # The database queue (auto for the api/worker roles) and its leases.
  REELFORGE_QUEUE_LEASE_SECONDS: "60"
  REELFORGE_QUEUE_MAX_ATTEMPTS: "3"
  REELFORGE_RATE_LIMIT_STORE: "database"
  REELFORGE_LOG_FORMAT: "json"
