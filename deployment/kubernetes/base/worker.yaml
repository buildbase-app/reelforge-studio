# The worker role: claims jobs from the database queue and renders them; serves
# only /healthz, /readyz and /metrics (server.role "worker", D-076). Scale on
# CPU and the queue depth (hpa.yaml). On SIGTERM a worker stops claiming, lets
# running renders finish for queue.shutdownGraceSeconds, then hands the rest
# back to the queue: keep terminationGracePeriodSeconds above that value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reelforge-worker
  namespace: reelforge
  labels: { app.kubernetes.io/name: reelforge, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: reelforge, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: reelforge, app.kubernetes.io/component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4321"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: reelforge
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          # Chromium's sandbox is on in the image (RENDERWELD_CHROMIUM_NO_SANDBOX=0, D-086) and needs
          # deployment/seccomp/chrome.json on every node as <kubelet dir>/seccomp/reelforge-chrome.json
          # (docs/DEPLOY.md#kubernetes). Under RuntimeDefault html, hyperframes and motion-canvas renders
          # fail ("Chromium could not start its sandbox"), unless you opt out with
          # RENDERWELD_CHROMIUM_NO_SANDBOX=1 (logged; docs/security/HARDENING.md).
          type: Localhost
          localhostProfile: reelforge-chrome.json
      containers:
        - name: reelforge
          image: ghcr.io/buildbase-app/reelforge-studio
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 4321, protocol: TCP }
          env:
            - { name: RENDERWELD_ROLE, value: worker }
            - { name: RENDERWELD_WORKER_CONCURRENCY, value: "1" }   # one render per pod; scale out with replicas
            - { name: RENDERWELD_QUEUE_SHUTDOWN_GRACE_SECONDS, value: "300" }
            - { name: DATABASE_URL_FILE, value: /run/secrets/reelforge/database-url }
            - { name: RENDERWELD_SECRET_KEY_FILE, value: /run/secrets/reelforge/secret-key }
            - { name: RENDERWELD_S3_ACCESS_KEY_ID_FILE, value: /run/secrets/reelforge/s3-access-key-id }
            - { name: RENDERWELD_S3_SECRET_ACCESS_KEY_FILE, value: /run/secrets/reelforge/s3-secret-access-key }
          envFrom:
            - configMapRef: { name: reelforge }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          resources:
            # One render: 1-1.5 cores, about 0.8 GB at 1080x1920 and 1.7 GB at 4K (docs/SCALE.md).
            requests: { cpu: "2", memory: 2Gi }
            limits: { memory: 4Gi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # Not ready while the database or storage is down or the worker is draining.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/reelforge, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: secrets
          secret: { secretName: reelforge, defaultMode: 0440 }
        # Render staging and engine caches (local to the pod; renders are committed to the bucket).
        - { name: data, emptyDir: { sizeLimit: 20Gi } }
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 1Gi } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }
---
# Metrics of the workers (they have no other HTTP endpoint).
apiVersion: v1
kind: Service
metadata:
  name: reelforge-worker-metrics
  namespace: reelforge
  labels: { app.kubernetes.io/name: reelforge, app.kubernetes.io/component: worker }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: reelforge, app.kubernetes.io/component: worker }
  ports:
    - { name: http, port: 4321, targetPort: http, protocol: TCP }
