# EXAMPLE ONLY: not part of kustomization.yaml. Create the real secret with
#
#   kubectl -n reelforge create secret generic reelforge \
#     --from-file=database-url=./database-url \
#     --from-file=secret-key=./secret-key \
#     --from-file=s3-access-key-id=./s3-access-key-id \
#     --from-file=s3-secret-access-key=./s3-secret-access-key \
#     --from-file=bootstrap-key=./bootstrap-key
#
# or from your secret manager (External Secrets, Sealed Secrets, CSI driver).
# database-url: postgresql://reelforge:<password>@postgres.db.svc:5432/reelforge (or mysql://...)
# secret-key:   openssl rand -base64 32 (the same on every instance: encrypted settings, signed links)
apiVersion: v1
kind: Secret
metadata:
  name: reelforge
  namespace: reelforge
type: Opaque
stringData:
  database-url: "postgresql://reelforge:CHANGE-ME@postgres.db.svc:5432/reelforge"
  secret-key: "CHANGE-ME-openssl-rand-base64-32"
  s3-access-key-id: "CHANGE-ME"
  s3-secret-access-key: "CHANGE-ME"
  bootstrap-key: "rf_CHANGE-ME"
