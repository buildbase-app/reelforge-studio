# The api role: REST /v1 and MCP /mcp; enqueues jobs in the database and never
# renders (server.role "api", D-076). Scale on CPU (hpa.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reelforge-api
  namespace: reelforge
  labels: { app.kubernetes.io/name: reelforge, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: reelforge, app.kubernetes.io/component: api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: reelforge, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: reelforge
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          # The api never renders (no Chromium), so the runtime's default profile is enough.
          # Workers need the Localhost profile for Chromium's sandbox (worker.yaml).
          type: RuntimeDefault
      containers:
        - name: reelforge
          image: ghcr.io/buildbase-app/reelforge-studio
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 4321, protocol: TCP }
          env:
            - { name: REELFORGE_ROLE, value: api }
            - { name: DATABASE_URL_FILE, value: /run/secrets/reelforge/database-url }
            - { name: REELFORGE_SECRET_KEY_FILE, value: /run/secrets/reelforge/secret-key }
            - { name: REELFORGE_S3_ACCESS_KEY_ID_FILE, value: /run/secrets/reelforge/s3-access-key-id }
            - { name: REELFORGE_S3_SECRET_ACCESS_KEY_FILE, value: /run/secrets/reelforge/s3-secret-access-key }
            - { name: REELFORGE_BOOTSTRAP_KEY_FILE, value: /run/secrets/reelforge/bootstrap-key }
          envFrom:
            - configMapRef: { name: reelforge }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60      # migrations run on the first start
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/reelforge, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: secrets
          secret: { secretName: reelforge, defaultMode: 0440 }
        # Remote storage keeps the files; /data only holds caches and staging.
        - { name: data, emptyDir: { sizeLimit: 5Gi } }
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 1Gi } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: reelforge-api
  namespace: reelforge
  labels: { app.kubernetes.io/name: reelforge, app.kubernetes.io/component: api }
spec:
  selector: { app.kubernetes.io/name: reelforge, app.kubernetes.io/component: api }
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
