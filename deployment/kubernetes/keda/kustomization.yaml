# KEDA overlay (issue #153, D-101): the worker Deployment scales from 0 to
# maxReplicaCount and back on the database job queue, read straight from the
# Job table by KEDA's PostgreSQL scaler. Replaces the worker HPA of the base
# (KEDA creates and owns its own); the api keeps its CPU HPA.
#
#   1. Install KEDA (2.21.1 tested):
#      kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.21.1/keda-2.21.1.yaml
#   2. Create the "reelforge" secret as for the base (its database-url is also KEDA's connection).
#   3. kubectl apply -k deployment/kubernetes/keda/
#
# Variants: mysql/ (KEDA's MySQL scaler), scaledjob/ (one Kubernetes Job per
# queued render running `worker --once`). Prometheus scaler and the recorded
# e2e run (e2e/k8s/keda.sh): docs/providers/queue-and-scaling.md#autoscaling-with-keda.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - scaledobject.yaml
components:
  - common
