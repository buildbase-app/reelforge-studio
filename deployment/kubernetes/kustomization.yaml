# RenderWeld on Kubernetes: an api Deployment (REST + MCP) and a worker
# Deployment (renders) sharing one PostgreSQL/MySQL database and one S3 bucket
# (issue #36, docs/providers/queue-and-scaling.md). Workers scale with the HPA
# in base/hpa.yaml (CPU and the renderweld_jobs_queued External metric).
#
#   1. Create the secret (see base/secret.example.yaml; never commit real values).
#   2. Edit base/configmap.yaml (public URL, bucket, endpoint) and the image tag in base/kustomization.yaml.
#   3. kubectl apply -k deployment/kubernetes/
#
# Scale to zero on the job queue instead: kubectl apply -k deployment/kubernetes/keda/
# (KEDA, issue #153; variants in keda/mysql/ and keda/scaledjob/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base
