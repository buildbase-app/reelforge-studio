# Prometheus scrape config for ReelForge Studio (docs/providers/observability.md).
# The studio serves the Prometheus text format on GET /metrics of its normal port
# (observability.metrics.exporter: prometheus, the default).
global:
  scrape_interval: 30s
scrape_configs:
  - job_name: reelforge-studio
    metrics_path: /metrics
    static_configs:
      - targets: ['reelforge:4321']   # host:port of the studio as Prometheus reaches it
    # When observability.metrics.bearerToken (REELFORGE_METRICS_TOKEN) is set:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/reelforge-metrics-token
