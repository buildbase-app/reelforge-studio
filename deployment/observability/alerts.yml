# Prometheus alert rules for ReelForge Studio: the queue-wait SLO (issue #155, D-103).
# docs/providers/observability.md#queue-wait-slo explains the SLO; load this file with `rule_files:` in
# prometheus.yml. Checked with `promtool check rules` and unit-tested with `promtool test rules alerts.test.yml`
# (e2e/docker/run.sh).
#
# SLO, at the maximum number of worker replicas: p95 of enqueue -> first claim below 60 s for previews and below
# 300 s (5 min) for renders. Both thresholds are bucket boundaries of reelforge_job_queue_wait_seconds, so the
# quantile is exact at the threshold. Every instance that claims jobs exports the histogram: sum it over all of them.
groups:
  - name: reelforge-queue-wait
    rules:
      - alert: ReelforgePreviewQueueWaitSLO
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(reelforge_job_queue_wait_seconds_bucket{reelforge_job_type="preview"}[15m]))) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Previews wait more than 60 s for a worker (p95, 15 min)
          description: >-
            p95 queue wait of previews is {{ $value | humanizeDuration }}. Add worker replicas (or raise the autoscaler's
            maximum), check that workers are claiming (reelforge_queue_errors_total, /readyz), or set
            limits.maxEstimatedWaitSeconds so new work is refused with Retry-After instead of piling up.
      - alert: ReelforgeRenderQueueWaitSLO
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(reelforge_job_queue_wait_seconds_bucket{reelforge_job_type="render"}[15m]))) > 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Renders wait more than 5 min for a worker (p95, 15 min)
          description: >-
            p95 queue wait of renders is {{ $value | humanizeDuration }}. Add worker replicas (or raise the autoscaler's
            maximum), lower per-key backlogs (limits.maxQueuedJobsPerKey), or set limits.maxEstimatedWaitSeconds.
