# RenderWeld with more than one instance on one Docker host (issue #36,
# docs/providers/queue-and-scaling.md): one api instance (REST + MCP, never
# renders), N workers (render from the database queue), PostgreSQL, and an
# S3-compatible bucket. Same image, different RENDERWELD_ROLE.
#
#   export POSTGRES_PASSWORD=$(openssl rand -hex 16)
#   export RENDERWELD_SECRET_KEY=$(openssl rand -base64 32)      # the same on every instance
#   export RENDERWELD_BOOTSTRAP_KEY=rf_$(openssl rand -hex 24)
#   export S3_ENDPOINT=https://s3.eu-central-1.amazonaws.com S3_BUCKET=my-renders S3_REGION=eu-central-1
#   export S3_ACCESS_KEY_ID=... S3_SECRET_ACCESS_KEY=...
#   docker compose -f deployment/compose/docker-compose.scale.yml up -d --scale worker=3
#
# The Docker e2e (SCALE=1 e2e/docker/run.sh) runs this topology against MinIO.
# For production put the secrets in files (*_FILE) instead of the environment.
x-reelforge: &reelforge
  image: ${RENDERWELD_IMAGE:-ghcr.io/buildbase-app/reelforge-studio:latest}
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=1g,mode=1777
    - /data:size=4g,uid=10001,gid=10001   # caches and render staging only: files live in the bucket
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp=../seccomp/chrome.json
  shm_size: 1gb
  depends_on:
    postgres:
      condition: service_healthy
x-env: &env
  DATABASE_URL: postgresql://reelforge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/reelforge
  RENDERWELD_SECRET_KEY: ${RENDERWELD_SECRET_KEY:?set RENDERWELD_SECRET_KEY}
  RENDERWELD_STORAGE_DRIVER: s3
  RENDERWELD_S3_ENDPOINT: ${S3_ENDPOINT:-}
  RENDERWELD_S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  RENDERWELD_S3_REGION: ${S3_REGION:-us-east-1}
  RENDERWELD_S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  RENDERWELD_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  RENDERWELD_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  RENDERWELD_CHROMIUM_NO_SANDBOX: "0"

services:
  api:
    <<: *reelforge
    environment:
      <<: *env
      RENDERWELD_ROLE: api
      RENDERWELD_BOOTSTRAP_KEY: ${RENDERWELD_BOOTSTRAP_KEY:-}
      RENDERWELD_PUBLIC_URL: ${RENDERWELD_PUBLIC_URL:-}
      RENDERWELD_ALLOWED_HOSTS: ${RENDERWELD_ALLOWED_HOSTS:-api}
    ports:
      - "127.0.0.1:${RENDERWELD_PORT:-4321}:4321"

  worker:
    <<: *reelforge
    environment:
      <<: *env
      RENDERWELD_ROLE: worker
      RENDERWELD_WORKER_CONCURRENCY: "1"
      RENDERWELD_QUEUE_SHUTDOWN_GRACE_SECONDS: "120"
    # Longer than the shutdown grace, so a stopping worker can finish or hand back its render.
    stop_grace_period: 150s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: reelforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: reelforge
    volumes:
      - reelforge-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelforge -d reelforge"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  reelforge-pg:
