# OpenTelemetry Collector for the Docker e2e (issue #64): receives OTLP/HTTP
# (traces, logs, metrics) from the studio and scrapes its Prometheus /metrics,
# then writes everything as OTLP JSON lines to /out for the checks.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: reelforge
          scrape_interval: 5s
          static_configs:
            - targets: ['reelforge:4321']
exporters:
  file/traces:
    path: /out/traces.jsonl
  file/logs:
    path: /out/logs.jsonl
  file/metrics:
    path: /out/metrics.jsonl
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces, debug]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
    metrics:
      receivers: [otlp, prometheus]
      exporters: [file/metrics]
