# ReelForge Studio on one host. See docs/DEPLOY.md.
#
#   export REELFORGE_BOOTSTRAP_KEY=rf_$(openssl rand -hex 24)   # first admin key (optional)
#   docker compose up -d --build
#   # or, without a bootstrap key, create the first key with the CLI:
#   docker compose exec reelforge reelforge keys create --name admin --scopes admin
#
# With TLS (Caddy, automatic HTTPS): set REELFORGE_DOMAIN and
#   docker compose --profile tls up -d --build
#
# Database: SQLite in the reelforge-data volume by default (nothing to set up).
# To use PostgreSQL or MySQL in this compose project (see docs/DEPLOY.md):
#   export POSTGRES_PASSWORD=$(openssl rand -hex 16)
#   export DATABASE_URL=postgresql://reelforge:$POSTGRES_PASSWORD@postgres:5432/reelforge
#   docker compose --profile postgres up -d --build
# or
#   export MYSQL_PASSWORD=$(openssl rand -hex 16) MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)
#   export DATABASE_URL="mysql://reelforge:$MYSQL_PASSWORD@mysql:3306/reelforge?allowPublicKeyRetrieval=true"
#   docker compose --profile mysql up -d --build
# Your own database server elsewhere: set DATABASE_URL only (no profile).
#
# Hardened by default (docs/DEPLOY.md#hardening): read-only root filesystem, /tmp
# as tmpfs, no Linux capabilities, no-new-privileges, non-root UID 10001, and the
# seccomp profile deployment/seccomp/chrome.json (Docker's default plus the user
# namespaces Chromium's sandbox needs), so html, hyperframes and motion-canvas
# render with Chromium's sandbox on. Without that profile set
# REELFORGE_CHROMIUM_NO_SANDBOX=1.
# Test profile (#66): Mailpit catches notification email (SMTP on mailpit:1025,
# web UI and API on 127.0.0.1:8025). Point the studio at it:
#   REELFORGE_SMTP_HOST=mailpit REELFORGE_SMTP_PORT=1025 REELFORGE_SMTP_SECURITY=none \
#   REELFORGE_EMAIL_FROM=studio@example.com docker compose --profile test up -d --build
# POSTGRES_IMAGE / MYSQL_IMAGE pick a mirror of the official images, e.g.
# mirror.gcr.io/library/postgres:17 or public.ecr.aws/docker/library/mysql:8.4.
services:
  reelforge:
    build:
      context: .
      args:
        # release (default): licence settings fixed by the image. dev: noncommercial development only (LICENSING.md).
        REELFORGE_EDITION: ${REELFORGE_EDITION:-release}
    image: ${REELFORGE_IMAGE:-reelforge-studio:latest}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deployment/seccomp/chrome.json
    ports:
      # Loopback only by default; put a TLS proxy in front for remote agents.
      - "127.0.0.1:${REELFORGE_PORT:-4321}:4321"
    environment:
      # rf_ followed by 20+ URL-safe characters; stored hashed on first start if no key exists.
      REELFORGE_BOOTSTRAP_KEY: ${REELFORGE_BOOTSTRAP_KEY:-}
      # Encrypts provider keys stored in the database; without it secrets cannot be stored over the API.
      # export REELFORGE_SECRET_KEY=$(openssl rand -base64 32)   (and keep a copy)
      REELFORGE_SECRET_KEY: ${REELFORGE_SECRET_KEY:-}
      # Optional config file (YAML/JSON, docs/CONFIG.md); mount it and point to it:
      REELFORGE_CONFIG: ${REELFORGE_CONFIG:-}
      REELFORGE_PUBLIC_URL: ${REELFORGE_PUBLIC_URL:-}
      REELFORGE_ALLOWED_HOSTS: ${REELFORGE_ALLOWED_HOSTS:-}
      REELFORGE_RENDER_CONCURRENCY: ${REELFORGE_RENDER_CONCURRENCY:-1}
      # Chromium's own sandbox (needs the seccomp profile above). Remotion always runs without it.
      REELFORGE_CHROMIUM_NO_SANDBOX: ${REELFORGE_CHROMIUM_NO_SANDBOX:-0}
      # Empty = SQLite at /data/reelforge.db. postgresql://... or mysql://... otherwise.
      DATABASE_URL: ${DATABASE_URL:-}
      # Optional providers / backends (leave empty to keep them off):
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Notification email over SMTP (docs/providers/webhooks-and-notifications.md); empty = off.
      REELFORGE_SMTP_HOST: ${REELFORGE_SMTP_HOST:-}
      REELFORGE_SMTP_PORT: ${REELFORGE_SMTP_PORT:-}
      REELFORGE_SMTP_SECURITY: ${REELFORGE_SMTP_SECURITY:-}
      REELFORGE_EMAIL_FROM: ${REELFORGE_EMAIL_FROM:-}
    volumes:
      - reelforge-data:/data
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    depends_on:
      # Only when the profile is active (required: false); the server also retries the first connection.
      postgres:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false

  postgres:
    profiles: ["postgres"]
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelforge
      POSTGRES_USER: reelforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # required with this profile
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelforge -d reelforge"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql:
    profiles: ["mysql"]
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reelforge
      MYSQL_USER: reelforge
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}  # required with this profile
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}  # required with this profile
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP, not the socket: the entrypoint's temporary server listens on the socket only.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u reelforge -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 60

  mailpit:
    profiles: ["test"]
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.34.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  caddy:
    profiles: ["tls"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      REELFORGE_DOMAIN: ${REELFORGE_DOMAIN:-localhost}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - reelforge

volumes:
  reelforge-data:
  caddy-data:
  postgres-data:
  mysql-data:
