name: Config docs

# Cheap check, only when the configuration schema or its generated reference
# changes: docs/CONFIG.md must match packages/core/src/config/schema.ts. (CI
# ignores docs-only changes, so this has its own workflow.)
on:
  push:
    paths: ['packages/core/src/config/**', 'docs/CONFIG.md', 'scripts/config-docs.ts']
  pull_request:
    branches: [main]
    paths: ['packages/core/src/config/**', 'docs/CONFIG.md', 'scripts/config-docs.ts']

concurrency:
  group: config-docs-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  config-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies (no install scripts; nothing native is needed)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: docs/CONFIG.md matches the configuration schema
        run: pnpm docs:config --check
