name: Config docs

# Cheap check, only when the configuration schema or its generated reference
# changes: docs/CONFIG.md must match packages/core/src/config/schema.ts. (CI
# ignores docs-only changes, so this has its own workflow.)
on:
  push:
    paths: ['packages/core/src/config/**', 'docs/CONFIG.md', 'scripts/config-docs.ts']
  pull_request:
    branches: [main]
    paths: ['packages/core/src/config/**', 'docs/CONFIG.md', 'scripts/config-docs.ts']

concurrency:
  group: config-docs-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  config-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies (no install scripts; nothing native is needed)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: docs/CONFIG.md matches the configuration schema
        run: pnpm docs:config --check
