name: pr-policy

# Checks every pull request against CONTRIBUTING.md: branch name, Conventional
# Commit title, target branch, linked issue, template checklist, AI disclosure,
# protected files. `pr-policy` is a required status check on `main`.
#
# SECURITY: pull_request_target runs with a write token so it can comment and
# label on PRs from forks. It checks out ONLY the base branch's policy script;
# the pull request's own code is never checked out or executed here.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, issues: write }
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { checkPullRequest, renderComment } = require('./.github/scripts/pr-policy.cjs');
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number, per_page: 100 });
            const result = checkPullRequest({
              branch: pr.head.ref, base: pr.base.ref, title: pr.title, body: pr.body,
              author: pr.user.login,
              isMaintainer: ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association),
              files: files.map((f) => f.filename),
              changedLines: pr.additions + pr.deletions,
              draft: pr.draft,
              isFork: pr.head.repo == null || pr.head.repo.full_name !== context.payload.repository.full_name,
            });
            const marker = '<!-- pr-policy -->';
            const body = renderComment(result, marker);
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr.number, per_page: 100 });
            const previous = comments.find((c) => c.user && c.user.type === 'Bot' && (c.body || '').startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else if (result.errors.length || result.warnings.length) await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            const label = 'policy: needs-changes';
            await core.summary.addRaw(body).write();
            if (result.errors.length) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [label] });
              core.setFailed(`PR policy: ${result.errors.length} problem(s) to fix. See the comment on the pull request.`);
            } else {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: label }).catch(() => {});
            }

  policy-tests:
    # The policy's own unit tests, from the base branch (no PR code).
    name: pr-policy tests
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test .github/scripts/pr-policy.test.cjs
