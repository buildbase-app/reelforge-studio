name: Docs publish

# Publishes docs/public to the renderweld.com docs (BuildBase docs, production
# environment) on every version tag, so the docs match the released image (#613).
# Run it by hand with "Run workflow" for the first publish; leave "dry run" on to
# see the planned changes first. See docs/DOCS_PUBLISHING.md.
#
# Needs the repository secret BUILDBASE_DOCS_TOKEN_PROD: an org API token for the
# production environment, with a role limited to docs, docs folders and docs tags.
# Without it the job fails before it changes anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would change (nothing is written)
        type: boolean
        default: true

concurrency:
  group: docs-publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The sync and its tests are plain Node with no dependencies: no install step.
      - name: Docs checks
        run: node --test scripts/docs/*.test.mjs
      - name: Token is set
        env:
          BUILDBASE_API_TOKEN: ${{ secrets.BUILDBASE_DOCS_TOKEN_PROD }}
        run: |
          if [ -z "$BUILDBASE_API_TOKEN" ]; then
            echo "::error::The repository secret BUILDBASE_DOCS_TOKEN_PROD is not set; nothing was published."
            exit 1
          fi
      - name: Publish to production
        env:
          BUILDBASE_API_TOKEN: ${{ secrets.BUILDBASE_DOCS_TOKEN_PROD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/docs/sync-buildbase.mjs --env production $DRY_RUN
