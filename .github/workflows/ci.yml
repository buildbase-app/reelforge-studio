name: CI

# What runs when (AGENTS.md "What CI runs when", D-043):
#   FAST  - every push to any branch: typecheck, unit tests, the SQLite server
#           tests with the MCP and REST end-to-end journeys (real engines).
#   HEAVY - pull requests to main, the merge queue, pushes to main, v* tags, the
#           nightly schedule and manual runs: PostgreSQL/MySQL, the spike render, the release
#           image (contents, secrets, Trivy, SBOM, Docker e2e on three databases
#           with the hardened flags, amd64 + arm64), and on main/tags the
#           signed multi-arch image on ghcr.io.
# Docs-only changes skip the jobs (pushes: paths-ignore; pull requests and the
# merge queue: the `changes` job), and `required` (the check branch protection
# requires, #62) always reports. docs/CONFIG.md drift has its own cheap
# workflow (config-docs.yml).
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md', 'research/**']
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

# A newer push to the same ref cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No token permissions by default; each job asks for what it needs (least privilege).
permissions: {}

env:
  HEAVY: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  changes:
    # Does this change touch more than docs? Pull requests and the merge queue
    # compare with their base; every other event counts as a code change (pushes
    # that only touch docs never start this workflow).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          n=$(echo "$files" | grep -Evc '^(docs/|research/)|\.md$' || true)
          if [ "${n:-0}" -gt 0 ]; then code=true; else code=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- FAST tier
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # A missing browser fails the engine and end-to-end tests instead of skipping them.
      REELFORGE_REQUIRE_BROWSER: '1'
      # Ubuntu 24.04 runners restrict unprivileged user namespaces, so Chromium's
      # own sandbox cannot start (verified: "No usable sandbox"). The runner VM is
      # the isolation boundary here.
      REELFORGE_CHROMIUM_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Chrome Headless Shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chrome-headless-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chrome Headless Shell
        run: |
          pnpm --filter @renderweld/engine-motion-canvas exec playwright-core install --with-deps chromium-headless-shell
          BIN=$(find ~/.cache/ms-playwright -type f -name chrome-headless-shell -perm -u+x | head -n 1)
          test -n "$BIN"
          echo "REELFORGE_CHROMIUM_PATH=$BIN" >> "$GITHUB_ENV"
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (schema, core, db, media pipeline, engines)
        run: pnpm -r --filter '!@renderweld/server' run test
      - name: Server tests + MCP and REST end-to-end on SQLite (real server process, all engines)
        run: pnpm --filter @renderweld/server run test
      - name: End-to-end spike (Remotion + Motion Canvas -> MP4)
        if: env.HEAVY == 'true'
        run: pnpm spike
      - name: Upload sample render
        if: env.HEAVY == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-reel
          path: |
            out/sample-reel/final.mp4
            out/sample-reel/render-manifest.json
            out/sample-reel/review/
          if-no-files-found: warn
          retention-days: 7

  # --------------------------------------------------------------- HEAVY tier
  database:
    # Repository contract tests and the server end-to-end suite (MCP + REST journeys,
    # real engines) against PostgreSQL and MySQL. SQLite runs in the test job above.
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reelforge
          POSTGRES_PASSWORD: reelforge
          POSTGRES_DB: reelforge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reelforge" --health-interval 5s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: reelforge
          MYSQL_DATABASE: reelforge
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -preelforge --silent" --health-interval 5s --health-timeout 5s --health-retries 60
    env:
      REELFORGE_REQUIRE_BROWSER: '1'
      REELFORGE_CHROMIUM_NO_SANDBOX: '1'
      REELFORGE_TEST_DB: ${{ matrix.db }}
      # Root: the tests create and drop a database (MySQL) or schema (PostgreSQL) per run.
      TEST_POSTGRES_URL: ${{ matrix.db == 'postgres' && 'postgresql://reelforge:reelforge@127.0.0.1:5432/reelforge' || '' }}
      TEST_MYSQL_URL: ${{ matrix.db == 'mysql' && 'mysql://root:reelforge@127.0.0.1:3306/reelforge?allowPublicKeyRetrieval=true' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Chrome Headless Shell
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chrome-headless-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chrome Headless Shell
        run: |
          pnpm --filter @renderweld/engine-motion-canvas exec playwright-core install --with-deps chromium-headless-shell
          BIN=$(find ~/.cache/ms-playwright -type f -name chrome-headless-shell -perm -u+x | head -n 1)
          test -n "$BIN"
          echo "REELFORGE_CHROMIUM_PATH=$BIN" >> "$GITHUB_ENV"
      - name: Schemas, migrations and generated clients are up to date
        if: matrix.db == 'postgres'
        env:
          CHECKPOINT_DISABLE: '1'
        run: |
          pnpm --filter @renderweld/db run check
          pnpm --filter @renderweld/db run generate
          git diff --exit-code -- packages/db
      - name: Repository contract tests (memory, SQLite, ${{ matrix.db }})
        run: pnpm --filter @renderweld/db run test
      - name: Server tests + MCP and REST end-to-end on ${{ matrix.db }}
        run: pnpm --filter @renderweld/server run test

  image:
    # The release image (Dockerfile default target), built natively per architecture:
    # contents and secrets checks, Trivy (fixable HIGH/CRITICAL fail), CycloneDX SBOM,
    # and the Docker e2e with the hardened run flags (release edition with the mock
    # licence server baked in; the published image differs in one layer, compared by
    # run.sh). amd64 runs the e2e on SQLite, PostgreSQL and MySQL; arm64 on SQLite.
    # On main and v* tags the release image is pushed by digest for `publish`.
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, dbs: 'sqlite postgres mysql' }
          - { arch: arm64, runner: ubuntu-24.04-arm, dbs: 'sqlite' }
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      TRIVY_IMAGE: aquasec/trivy:0.76.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the release image (published defaults)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: reelforge-studio:release
          build-args: |
            REELFORGE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Build the release edition with the mock licence server baked in (e2e)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: reelforge-studio:e2e
          build-args: |
            REELFORGE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
            VCS_REF=${{ github.sha }}
            LICENCE_SERVER_URL=http://licence:8080
            LICENCE_ORG_ID=6b01478bb42d2c444e99fcd8-mocklice
          cache-from: type=gha,scope=release-${{ matrix.arch }}
      - name: Image contents and size budget
        run: scripts/image/check-contents.sh reelforge-studio:release
      - name: No secrets in layers, config or files
        run: scripts/image/check-secrets.sh reelforge-studio:release
      - name: Cache the Trivy database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.arch }}-
      - name: Trivy (fixable HIGH/CRITICAL fail the build)
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ~/.cache/trivy:/root/.cache/trivy "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 reelforge-studio:release
      - name: CycloneDX SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ~/.cache/trivy:/root/.cache/trivy -v "$PWD:/out" "$TRIVY_IMAGE" \
            image --format cyclonedx --output /out/sbom-${{ matrix.arch }}.cdx.json reelforge-studio:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.cdx.json
          retention-days: 30
      - name: Docker end-to-end, hardened flags (${{ matrix.dbs }})
        run: |
          for db in ${{ matrix.dbs }}; do
            extra=(); [ "$db" = sqlite ] && extra=(RELEASE_IMAGE=reelforge-studio:release)
            env DB=$db IMAGE=reelforge-studio:e2e SKIP_BUILD=1 PORT=4322 "${extra[@]}" e2e/docker/run.sh
          done
      - name: Log in to ghcr.io (main and v* tags)
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the release image by digest (main and v* tags)
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            REELFORGE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
            VCS_REF=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
      - name: Record the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    # main and v* tags only: one multi-arch manifest on ghcr.io, signed with cosign
    # (keyless, GitHub OIDC) and with the CycloneDX SBOM attached as an attestation.
    # Branches never push or sign (D-043).
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-arch manifest
        working-directory: digests
        run: |
          # shellcheck disable=SC2046 # one argument per tag and per digest
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (keyless) and attach the SBOM
        run: |
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)
          REF="ghcr.io/${{ github.repository }}@$DIGEST"
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom-amd64.cdx.json "$REF"
          echo "signed $REF" >> "$GITHUB_STEP_SUMMARY"

  required:
    # The one CI check branch protection requires (#62): green when every job
    # above succeeded or was skipped (tier or docs-only), so it always reports.
    name: required
    if: always()
    needs: [changes, test, database, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
