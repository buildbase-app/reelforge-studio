name: Feature request
description: Suggest an improvement or a new capability.
title: 'feat: '
labels: ['type: feature', 'status: triage']
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: 'What are you trying to do, and what gets in the way? Describe the problem before the solution.' }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution, description: 'What should happen? For agent/API features: the tool or endpoint and its input and output.' }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: dropdown
    id: contribute
    attributes:
      label: Would you open a pull request for this?
      options: ['No', 'Yes, after a maintainer agrees on the approach', 'Maybe, with guidance']
    validations: { required: true }
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
